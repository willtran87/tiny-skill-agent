[project]
name = "tiny-skill-agent"
version = "0.1.0"
description = "A minimal LangChain/LangGraph ReAct agent with file-based skills"
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-ollama>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6"]

[project.scripts]
tiny-agent = "tiny_skill_agent.agent:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiny_skill_agent = ["sample_skills/*/SKILL.md"]
